      //get video id
      let videoId = "jOaDjhjI_bI", videoIdOld;
      function getVideoId() {
        //create url var
        let url = urlInput.value;
        //return if no url value
        if (url == "") return;
        //create keywords array
        let start_keywords = ["?v=", "youtu.be/"];
        let end_keywords = ["?", "&"];
        //find starting pos
        let start = -1;
        for (let i of start_keywords) {
          //index
          let index = url.indexOf(i);
          //test keyword
          if (index != -1) {
            start = index + i.length;
            break;
          }
        }
        if (start == -1) {
          videoId = null;
          return;
        }
        //find ending pos
        let end = -1;
        for (let i of end_keywords) {
          //index
          let index = url.indexOf(i, start);
          //test keyword
          if (index != -1) {
            end = index;
            break;
          }
        }
        if (end === -1)
          end = url.length;
        //combine video id
        videoIdOld = videoId;
        videoId = url.substring(start, end);
        return videoId;
      }
      

      //remove player
      function removePlayer() {
        //remove old yt-player
        try {
          document.getElementById("yt-player").remove();
        } catch {}
        //create new yt-player
        let playerDiv = document.createElement("div")
        playerDiv.id = "yt-player";
        //place new yt-player after url input
        let placeholder = document.getElementById("yt-placeholder");
        placeholder.after(playerDiv);
      } 
      //new player function
      var player;
      function newPlayer(id) {
        player = new YT.Player('yt-player', {
          height: '390',
          width: '640',
          videoId: id,
          playerVars: {
            'playsinline': 1
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }
